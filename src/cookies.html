<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Политика использования файлов cookies — Додо Пицца × Помощь приютам</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Dodo Narrow";src:url(data:font/ttf;base64,__FONT__) format("truetype");font-display:block}
:root{--orange:#FF5F00;--peach:#FBE6D8;--ink:#682B00;--ink-50:rgba(104,43,0,.72);--f-display:"Dodo Narrow","Arial Narrow",Impact,sans-serif;--f-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.top img{width:52px;height:auto;display:block}
.back{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--peach);color:var(--orange);font-weight:600;font-size:15px;text-decoration:none}
h1{margin:40px 0 28px;font-family:var(--f-display);font-weight:400;font-size:53px;line-height:.85;letter-spacing:-.02em;color:var(--orange);text-transform:lowercase;text-wrap:balance}
.doc{font-weight:500;font-size:16px;line-height:1.5;color:var(--ink-50);text-wrap:pretty}
.doc h2{margin:32px 0 10px;font-weight:700;font-size:19px;line-height:1.25;color:var(--ink)}
.doc p,.doc ul,.doc ol{margin:0 0 12px}
.doc a{color:var(--orange)}
.todo{padding:20px;border-radius:20px;background:#FFF6EF;color:var(--ink)}
.foot{margin-top:64px;padding:28px 0 40px;border-top:1.5px solid var(--peach);font-weight:500;font-size:13px;line-height:1.45;color:var(--ink-50)}
.foot p{margin:0}
@media (min-width:900px){h1{font-size:104px;margin:72px 0 40px}.doc{font-size:18px}.doc h2{font-size:22px}.foot{font-size:15px}.top{padding:24px 0}.top img{width:64px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a href="./" aria-label="На главную"><img src="assets/logo.png" alt="Додо Пицца"></a><a class="back" href="./">← на главную</a></header>
  <h1>политика использования файлов cookies</h1>
  <main class="doc">
    <!-- COOKIE-POLICY-TEXT -->
    <div class="todo">Здесь будет полный текст политики использования файлов cookies — тот же, что на dodopizza.ru/legal/cookie-policy.</div>
    <!-- /COOKIE-POLICY-TEXT -->
  </main>
  <footer class="foot"><p>© 2026 ООО «Додо Франчайзинг»<br>ОГРН 1131101001844, ИНН 1101140415<br>167001, Республика Коми, г. Сыктывкар, Октябрьский проспект, д. 16</p></footer>
</div>
</body>
</html>
